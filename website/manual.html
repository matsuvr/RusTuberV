<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ROOT}}assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ROOT}}assets/site.css?v=5">
  <title>{{TITLE}} | RusTuberV</title>
</head>
<body class="manual-page">
  <a class="skip-link" href="#main">{{SKIP_LABEL}}</a>
  <header class="site-header"><div class="header-inner"><a class="brand" href="{{ROOT}}"><img src="{{ROOT}}assets/app-icon.svg" width="36" height="36" alt=""><span>RusTuberV</span></a><nav aria-label="{{NAV_LABEL}}"><a href="{{ROOT}}">{{PRODUCT_LABEL}}</a><a aria-current="page" href="{{GUIDE_URL}}">{{GUIDE_LABEL}}</a><a class="nav-download" href="https://github.com/matsuvr/RusTuberV/releases/latest">{{DOWNLOAD_LABEL}} <span aria-hidden="true">↗</span></a><a class="nav-source" href="{{SOURCE_URL}}">{{SOURCE_LABEL}} <span aria-hidden="true">↗</span></a></nav></div></header>
  <div class="manual-shell section-wrap">
    <aside class="manual-sidebar"><details class="manual-toc" open><summary>{{TOC_LABEL}}</summary><nav aria-label="{{TOC_LABEL}}">{{TOC}}</nav></details></aside>
    <main id="main" class="manual-main"><div class="manual-topline"><nav class="manual-languages" aria-label="Language">{{LANGUAGES}}</nav></div><article class="manual-content">{{CONTENT}}</article><div class="manual-end"><a href="#main">{{TOP_LABEL}} <span aria-hidden="true">↑</span></a><a href="https://github.com/matsuvr/RusTuberV/issues">{{HELP_LABEL}} <span aria-hidden="true">↗</span></a></div></main>
  </div>
  <footer class="site-footer section-wrap"><div class="footer-main"><a class="brand" href="{{ROOT}}"><img src="{{ROOT}}assets/app-icon.svg" width="28" height="28" alt=""><span>RusTuberV</span></a><nav aria-label="GitHub"><a href="https://github.com/matsuvr/RusTuberV">GitHub</a><a href="https://github.com/matsuvr/RusTuberV/blob/main/LICENSE">MIT License</a></nav></div></footer>
</body>
</html>
