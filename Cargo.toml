[workspace]
members = [
  "crates/vtuber-core",
  "crates/vtuber-camera",
  "crates/vtuber-inference",
  "crates/vtuber-tracking",
  "crates/vtuber-avatar",
  "crates/vtuber-ndi",
  "crates/vtuber-app",
  "apps/desktop",
  "tools/xtask",
]
exclude = ["vendor/bevy_vrm1"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
authors = ["RusTuberV contributors"]
repository = "https://github.com/matsuvr/RusTuberV"

[workspace.dependencies]
bevy_egui = { version = "=0.41.1", default-features = false, features = ["default_fonts", "render"] }
rfd = { version = "=0.17.2", default-features = false }

[patch."https://github.com/not-elm/bevy_vrm1"]
bevy_vrm1 = { path = "vendor/bevy_vrm1" }

# Build artifact disk policy (AGENTS.md): full debug info in dev builds is
# the single largest contributor to target/ size (tens of GiB). Line tables
# keep panic backtraces readable with file/line numbers; do not restore
# "debug = true" / 2.
[profile.dev]
debug = "line-tables-only"

# Runtime performance profile: whole-crate cross-language-unit optimization.
# The pipeline is allocation- and inlining-sensitive (per-frame image loops),
# so thin LTO + single codegen unit measurably improves the hot path.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
# Production code must be panic-free and unsafe-free (see AGENTS.md:
# "Production Rust panic policy" / "Unsafe code").
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_panics_doc = "allow"
# Production Rust panic policy (AGENTS.md). The workspace is now panic-free:
# these lints are denied. Tests may opt out with module-level allows
# (tests may panic per AGENTS.md); documented production invariants use
# per-site #[allow] with an invariant comment.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
