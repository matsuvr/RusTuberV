[workspace]
members = [
  "crates/vtuber-core",
  "crates/vtuber-camera",
  "crates/vtuber-platform",
  "crates/vtuber-inference",
  "crates/vtuber-tracking",
  "crates/vtuber-avatar",
  "crates/vtuber-ndi",
  "crates/vtuber-app",
  "apps/desktop",
  "tools/xtask",
]
exclude = ["vendor/mediapipe-rs", "vendor/nokhwa"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
authors = ["RusTuberV contributors"]
repository = "https://github.com/matsuvr/RusTuberV"

[workspace.dependencies]
bevy = "=0.19.0"
bevy_vrm1 = { git = "https://github.com/not-elm/bevy_vrm1", tag = "v0.9.3" }
mediapipe = { git = "https://github.com/nikicat/mediapipe-rs", rev = "527037fa0fe1339750140283930bbb9560460e9e", version = "=0.1.0" }
bevy_egui = { version = "=0.41.1", default-features = false, features = ["default_fonts", "render", "open_url"] }
rfd = { version = "=0.17.2", default-features = false }

# ADR-009 fixes mediapipe-rs at this revision. It is vendored under
# `vendor/mediapipe-rs` so the Pose task can be added without pushing to the
# upstream repository. The git revision stays as the provenance in
# `vendor/mediapipe-rs/vendor/REF`; THIRD_PARTY_NOTICES records the license.
[patch."https://github.com/nikicat/mediapipe-rs"]
mediapipe = { path = "vendor/mediapipe-rs" }

# Bound AVFoundation reads so a sleeping camera cannot strand the worker.
[patch.crates-io]
nokhwa = { path = "vendor/nokhwa" }

# Temporary upstream-bound fixes: MToon transparency (#94) and published
# expression weights (#212). Remove when both APIs/fixes are available upstream.
[patch."https://github.com/not-elm/bevy_vrm1"]
bevy_vrm1 = { git = "https://github.com/matsuvr/bevy_vrm1", rev = "be60f99d35c4d786b0d17c93aef07e60aa31f34d" }

# Keep dev and test artifacts small. The test profile inherits dev settings.
# This removes debugger symbols and incremental build caches;
# re-enable them only when explicitly needed for a debugging session.
[profile.dev]
debug = 0
incremental = false

# Keep the real-time anatomy solver usable in the debug application too.
# Preserve debug assertions; only optimize its hot crates.
[profile.dev.package.vtuber-avatar]
opt-level = 3

[profile.dev.package.vtuber-tracking]
opt-level = 3

[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

# Runtime performance profile: whole-crate cross-language-unit optimization.
# The pipeline is allocation- and inlining-sensitive (per-frame image loops),
# so thin LTO + single codegen unit measurably improves the hot path.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
# Production code must be panic-free and unsafe-free (see AGENTS.md:
# "Production Rust panic policy" / "Unsafe code").
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_panics_doc = "allow"
# Production Rust panic policy (AGENTS.md). The workspace is now panic-free:
# these lints are denied. Only test modules and test-only code opt out, with a
# module-level `#![allow(...)]` inside the test module; documented production
# invariants use a per-site `#[expect(..., reason = "...")]` that states the
# invariant itself.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
