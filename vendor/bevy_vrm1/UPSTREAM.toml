notes = "Q2-06-001 adds direct yaw/pitch/roll input, upperChest participation, per-axis weights, per-bone half-life, and an early direct-pose system. Q2-06-002 adds a target-free head-relative LookAt input, model range-map reuse, exclusive Bone/Expression output, additive eye animation composition, cleanup, and VRM 1.0 LookAt/Expression/Constraint/SpringBone ordering while preserving the legacy Cursor/Target path. Epic 22 adds a pure VRM 0.x/1.0 core descriptor parser without a second loader or ECS runtime. The dev-only bevy_test_helper dependency is pinned to the v0.18 branch revision observed when vendored."

[mtoon_display]
# The fixed Native display and the Rich display are separate fragment stages
# over one shared reference, selected by MToonMaterial::shading_mode through
# MToonMaterialKey::RICH_SHADING.
native_reference_revision = "f9593fd78136fb9e0507bcae111e09291ec9b82a"
native_files = [
  "src/vrm/mtoon_native.wgsl",
  "src/vrm/mtoon_fragment.wgsl",
  "src/vrm/mtoon_types.wgsl",
  "src/vrm/mtoon_vertex.wgsl",
]
rich_files = [
  "src/vrm/mtoon_rich_fragment.wgsl",
  "src/vrm/mtoon_lighting.wgsl",
  "src/vrm/mtoon_portrait.wgsl",
  "src/vrm/mtoon_prepass.wgsl",
]
notes = "mtoon_native.wgsl is the upstream f9593fd MToon fragment computation moved out of mtoon_fragment.wgsl without changes; mtoon_fragment.wgsl is its upstream entry point and mtoon_types/mtoon_vertex are upstream plus the Rich-only normal texture, portrait uniform fields, the RICH_SHADING GPU effective flag and their flags. mtoon_rich_fragment.wgsl evaluates the same Native reference first and composes the Rich display with compose_rich_mtoon, which is the identity at strength 0. The Rich transparent-fragment discard evaluates the authored base alpha (base color x base texture) with the animated UV, because the Native lit_color forces Blend alpha to 1 in the outline pass. mtoon_prepass.wgsl activates the Rich cutout shadow only for RICH_SHADING materials with a positive strength, so a saved strength cannot change a Native material's shadow. The Rich-only stages must not alter the Native reference, its alpha, its normals or its depth; Native and Rich must render identically when the Rich effect amount is 0. tools/xtask/src/mtoon_upstream_reference.wgsl is the fixture's independent copy of the upstream fragment at this revision; it is not a vendor file and is compared against the production Native display on the GPU."
