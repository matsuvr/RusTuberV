notes = "Q2-06-001 adds direct yaw/pitch/roll input, upperChest participation, per-axis weights, per-bone half-life, and an early direct-pose system. Q2-06-002 adds a target-free head-relative LookAt input, model range-map reuse, exclusive Bone/Expression output, additive eye animation composition, cleanup, and VRM 1.0 LookAt/Expression/Constraint/SpringBone ordering while preserving the legacy Cursor/Target path. Epic 22 adds a pure VRM 0.x/1.0 core descriptor parser without a second loader or ECS runtime. The dev-only bevy_test_helper dependency is pinned to the v0.18 branch revision observed when vendored."
