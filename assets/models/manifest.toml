# Face inference model manifest for RusTuberV G0-05.

[metadata]
name = "RusTuberV face inference models"
version = "0.1.0"
downloaded_at = "2026-08-05"
notes = [
    "MediaPipe Face Landmarker is the sole production face backend through the pinned native binding in ADR-009.",
    "The task bundle is consumed as a bundle; internal models are not extracted into an application pipeline.",
    "The legacy composite artifacts below are retained only for explicit research/evaluation commands.",
]

[[artifacts]]
file = "face_landmarker.task"
sha256 = "64184E229B263107BC2B804C6625DB1341FF2BB731874B0BCC2FE6544E0BC9FF"
purpose = "Official MediaPipe Face Landmarker task bundle (ZIP-like archive)"
source = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
upstream = "https://developers.google.com/edge/mediapipe/solutions/vision/face_landmarker"
license = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0.html"
redistribution = "allowed under Apache-2.0; prefer original upstream URL for updates"
notes = ["Approved production bundle; verified by SHA-256 before worker construction."]

[[artifacts]]
file = "face_detector.tflite"
sha256 = "B4578F35940BF5A1A655214A1CCE5CAB13EBA73C1297CD78E1A04C2380B0152F"
purpose = "BlazeFace short-range face detector"
input = { shape = [1, 128, 128, 3], dtype = "float32", layout = "NHWC", mean = 127.5, scale = 127.5 }
output = { names = ["detections"], description = "face detection boxes and keypoints" }

[[artifacts]]
file = "face_landmarks_detector.tflite"
sha256 = "C7D54204CE0448474C7F3FA9AF494787C0965CBDD6F20FC72867E43046BD43D5"
purpose = "FaceMesh-V2 478 3D landmarks"
input = { shape = [1, 192, 192, 3], dtype = "float32", layout = "NHWC", mean = 0.0, scale = 1.0 }
output = { names = ["face_landmarks", "face_flag", "lip_countour"], description = "478 3D landmarks plus face presence and lip contour" }

[[artifacts]]
file = "face_blendshapes.tflite"
sha256 = "4F36DDED049DB18D76048567439B2A7F58F1DAABC00D78BFE8F3AD396A2D2082"
purpose = "52 blendshape coefficients"
input = { shape = [1, 146, 2], dtype = "float32", layout = "N?C", description = "146 selected landmarks (x, y)" }
output = { names = ["blendshapes"], description = "52 blendshape scores in [0, 1]" }

[[artifacts]]
file = "geometry_pipeline_metadata_landmarks.binarypb"
sha256 = "BDBCDA96DFCB7DA883DA124AAA2C55DEE49770D934F0FCC71747F8C21BDC75B4"
purpose = "MediaPipe internal geometry pipeline metadata"

[[artifacts]]
file = "face_landmark.tflite"
sha256 = "1055CB9D4A9CA8B8C688902A3A5194311138BA256BCC94E336D8373A5F30C814"
purpose = "Legacy MediaPipe Face Mesh (float32)"
source = "https://storage.googleapis.com/mediapipe-assets/face_landmark.tflite"
license = "Apache-2.0"
input = { shape = [1, 192, 192, 3], dtype = "float32", layout = "NHWC", mean = 0.0, scale = 1.0 }
output = { names = ["face_landmarks"], description = "468 3D landmarks" }
notes = ["Legacy float32 model evaluated as TFLite fallback; also blocked by tract-tflite F16 ADD operator."]

[legacy_research_pipeline]
id = "ultraface-rfb-320-peppapig-98"
detector_model = "ultraface-rfb-320"
landmark_model = "peppapig-98"

[legacy_research_pipeline.detector_postprocess]
score_threshold = 0.7
nms_iou = 0.3
max_pre_nms_candidates = 256
max_post_nms_detections = 16

[legacy_research_pipeline.crop]
square_scale = 1.35
center_y_offset_fraction = -0.05
output_size = [256, 256]
interpolation = "bilinear"
outside_fill = "normalization_mean"

[[models]]
id = "peppapig-98"
role = "face_landmarks"
file = "peppapig_student_1x3x256x256.onnx"
byte_size = 13728231
sha256 = "73EDF90954F05EBEF4639E7FA8620C5F83CCA09D2476DE66AB100F26C2B25E7A"
input_name = "input"
source = "https://s3.ap-northeast-2.wasabisys.com/pinto-model-zoo/436_Peppa_Pig_Face_Landmark/resources.tar.gz"
upstream = "https://github.com/610265158/Peppa_Pig_Face_Landmark"
license = "Apache-2.0"
license_url = "https://github.com/610265158/Peppa_Pig_Face_Landmark/blob/master/LICENSE"
schema = "peppapig-98"
requires_crop = true
landmark_coordinate_encoding = "normalized_0_1"
pose_method = "canonical_orthographic_2d"
representative_indices = [16, 37, 46, 52, 63, 71, 76, 82]
input = { shape = [1, 3, 256, 256], dtype = "float32", layout = "NCHW", channel_order = "RGB", value_domain = "unit_float", normalization = { mean = [0.485, 0.456, 0.406], scale = [0.229, 0.224, 0.225] } }
outputs = [{ name = "/Concat_1", shape = [1, 98, 3], dtype = "float32", description = "98 facial landmarks with visibility/confidence in third channel" }]

[[models]]
id = "ultraface-rfb-320"
role = "face_detector"
file = "version-RFB-320.onnx"
byte_size = 1270727
sha256 = "34cd7e60aeff28744c657de7a3dc64e872d506741de66987f3426f2b79f88017"
input_name = "input"
source = "https://huggingface.co/onnxmodelzoo/version-RFB-320/resolve/main/version-RFB-320.onnx"
upstream = "https://github.com/onnx/models/tree/main/vision/body_analysis/ultraface"
license = "MIT"
license_url = "https://opensource.org/license/mit/"
requires_crop = false
input = { shape = [1, 3, 240, 320], dtype = "float32", layout = "NCHW", channel_order = "RGB", value_domain = "raw_u8", normalization = { mean = [127.0, 127.0, 127.0], scale = [128.0, 128.0, 128.0] } }
outputs = [
    { name = "scores", shape = [1, 4420, 2], dtype = "float32", description = "Per-anchor background and face scores" },
    { name = "boxes", shape = [1, 4420, 4], dtype = "float32", description = "Per-anchor encoded face boxes" },
]
