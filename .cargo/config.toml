# Repository-local Cargo configuration.
#
# The `xtask` alias lets `cargo xtask <task> ...` resolve in a plain checkout.
# The trailing `--` is part of the alias; do not repeat the separator.
[alias]
xtask = "run -p xtask --"

# MSVC still writes PDBs for test executables with profile.dev debug = 0.
# Suppress them for Windows builds; macOS needs no linker override.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]
