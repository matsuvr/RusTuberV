[package]
name = "bevy_looking_glass"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["matsuvr", "RusTuberV contributors"]
description = "Direct Looking Glass display output for Bevy, using Rust and WESL without the Bridge SDK"
repository = "https://github.com/matsuvr/bevy-looking-glass-rs"
readme = "README.md"
keywords = ["bevy", "looking-glass", "light-field", "holographic"]
categories = ["rendering", "game-development"]
include = ["src/**", "examples/**", "README.md", "LICENSE", "rust-toolchain.toml", "Cargo.lock"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "bevy_asset", "bevy_camera", "bevy_color", "bevy_core_pipeline", "bevy_image", "bevy_light", "bevy_mesh", "bevy_render", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_window"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["async_executor", "bevy_log", "bevy_pbr", "bevy_winit", "multi_threaded", "x11", "tonemapping_luts", "zstd_rust"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
