[package]
name = "vtuber-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Model loading, Rust preprocessing, and native MediaPipe inference boundary for RusTuberV."

[dependencies]
vtuber-core = { path = "../vtuber-core" }
mediapipe = { workspace = true }
tract-tflite = "=0.23.8"
# This CNN does not need tract's transformer operators.
tract-onnx = { version = "=0.23.8", default-features = false }
tract-core = { version = "=0.23.8", optional = true }
sha2 = "0.11"
hex = "=0.4.3"
thiserror = "2"
anyhow = "=1.0.103"

[features]
# HaGRID uses tract-onnx in the normal hand pipeline. The legacy face
# detector/crop stack remains opt-in for research and evaluation commands.
default = []
legacy-face-stack = ["onnx"]
onnx = ["dep:tract-core", "tract-onnx/transformers"]

[build-dependencies]
toml = "1.1"

[dev-dependencies]

[lints]
workspace = true
