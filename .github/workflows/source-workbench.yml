name: Source workbench (temporary, not for merge)

on:
  push:
    branches: [workbench/source-only-20260926]
    paths: [.github/workflows/source-workbench.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare the repository-pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          root=$(rustup run 1.97.1 rustc --print sysroot)
          tar -C "$root" -czf "$RUNNER_TEMP/rust-tools.tar.gz" bin/cargo bin/rustc bin/rustfmt lib
          rustup run 1.97.1 rustc --version
          rustup run 1.97.1 rustfmt --version
          du -h "$RUNNER_TEMP/rust-tools.tar.gz"
      - name: Export the tools for source editing
        uses: actions/upload-artifact@v4
        with:
          name: pinned-rust-tools-for-editing
          path: ${{ runner.temp }}/rust-tools.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
