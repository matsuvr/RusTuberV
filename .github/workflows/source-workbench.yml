name: Source workbench (temporary, not for merge)
on:
  push:
    branches: [workbench/source-only-20260926]
    paths: [.github/workflows/source-workbench.yml]
permissions:
  contents: read
jobs:
  linux-validation-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the Linux-only validation feature without changing product branches
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          git clone --depth=1 --branch fix/123-reuse-user-asset-path "https://github.com/$REPOSITORY.git" source
          cd source
          cp Cargo.lock "$RUNNER_TEMP/original.lock"
          sed -i 's/rfd = { version = "=0.17.2", default-features = false }/rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }/' Cargo.toml
          cargo +1.97.1 vendor --versioned-dirs "$RUNNER_TEMP/validation-vendor" > "$RUNNER_TEMP/validation-config.toml"
          cp Cargo.lock "$RUNNER_TEMP/validation-Cargo.lock"
          python3 - <<'PY'
          import pathlib, shutil, tomllib, os
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          old = tomllib.loads((root / 'original.lock').read_text())
          new = tomllib.loads((root / 'validation-Cargo.lock').read_text())
          old_items = {(p['name'], p['version'], p.get('source')) for p in old['package']}
          new_items = {(p['name'], p['version'], p.get('source')) for p in new['package']}
          assert not old_items - new_items, 'The validation feature must not replace pinned packages'
          extra = root / 'extra-validation-dependencies'
          extra.mkdir()
          for name, version, source in sorted(new_items - old_items):
              package = root / 'validation-vendor' / f'{name}-{version}'
              if package.is_dir():
                  shutil.move(package, extra / package.name)
          PY
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/linux-validation-deps.tar.gz" extra-validation-dependencies validation-Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: linux-validation-dependencies
          path: ${{ runner.temp }}/linux-validation-deps.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
