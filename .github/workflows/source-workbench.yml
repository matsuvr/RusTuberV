name: Source workbench (temporary, not for merge)
on:
  push:
    branches: [workbench/source-only-20260926]
    paths: [.github/workflows/source-workbench.yml]
permissions:
  contents: read
jobs:
  model-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download only the three existing approved embedded tasks
        run: |
          mkdir -p models
          curl --fail --location --output models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          curl --fail --location --output models/pose_landmarker_full.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
          curl --fail --location --output models/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          echo '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  models/face_landmarker.task' | sha256sum --check
          echo '4eaa5eb7a98365221087693fcc286334cf0858e2eb6e15b506aa4a7ecdcec4ad  models/pose_landmarker_full.task' | sha256sum --check
          echo 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  models/hand_landmarker.task' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: approved-model-tasks
          path: models/*.task
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
